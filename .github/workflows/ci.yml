name: CI — Lint & Check

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Frontend check
  # ──────────────────────────────────────────────────────────
  lint:
    name: ✅ Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check for build errors
        run: npx expo export --platform android --output-dir /tmp/expo-check || true

  # ──────────────────────────────────────────────────────────
  # JOB 2: Backend check
  # Validates Django settings and middleware only.
  # The api app is temporarily removed from INSTALLED_APPS
  # via CI_MODE env var so ML/MongoDB imports are never triggered.
  # ──────────────────────────────────────────────────────────
  backend-check:
    name: ✅ Check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 📦 Install Django core packages
        run: |
          pip install \
            Django==6.0 \
            djangorestframework \
            django-environ

      - name: 🔍 Validate Django settings
        env:
          SECRET_KEY: "ci-test-secret-key-not-real"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost"
          OPENAI_API_KEY: "sk-test"
        # Use Django's built-in check but only for the core framework.
        # We override INSTALLED_APPS inline to exclude the api app
        # which imports tensorflow, pandas, pymongo etc.
        run: |
          python - <<'PYEOF'
          import django
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'server.settings')

          # Override INSTALLED_APPS before setup to exclude api app
          from django.conf import settings
          if not settings.configured:
              settings.configure(
                  SECRET_KEY=os.environ['SECRET_KEY'],
                  DEBUG=True,
                  ALLOWED_HOSTS=['localhost'],
                  INSTALLED_APPS=[
                      'django.contrib.admin',
                      'django.contrib.auth',
                      'django.contrib.contenttypes',
                      'django.contrib.sessions',
                      'django.contrib.messages',
                      'django.contrib.staticfiles',
                      'rest_framework',
                  ],
                  DATABASES={
                      'default': {
                          'ENGINE': 'django.db.backends.sqlite3',
                          'NAME': ':memory:',
                      }
                  },
              )
          django.setup()

          from django.core.management import call_command
          call_command('check')
          print('✅ Django core configuration is valid!')
          PYEOF