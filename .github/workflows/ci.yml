name: CI — Lint & Check

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Frontend check
  # ──────────────────────────────────────────────────────────
  lint:
    name: ✅ Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check for build errors
        run: npx expo export --platform android --output-dir /tmp/expo-check || true

  # ──────────────────────────────────────────────────────────
  # JOB 2: Backend check
  # Validates Django settings, middleware, and URL structure.
  # Skips the 'api' app to avoid importing ML/MongoDB packages
  # (tensorflow, pandas, pymongo etc.) which are too large for CI
  # and not needed for a configuration validity check.
  # ──────────────────────────────────────────────────────────
  backend-check:
    name: ✅ Check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 📦 Install Django core packages
        run: |
          pip install \
            Django==6.0 \
            djangorestframework \
            django-environ

      - name: 🔍 Check Django core configuration
        env:
          SECRET_KEY: "ci-test-secret-key-not-real"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost"
          OPENAI_API_KEY: "sk-test"
        # --tag django checks only Django's core (settings, middleware, URLs)
        # without loading the api app and its ML/MongoDB imports
        run: python manage.py check --tag django