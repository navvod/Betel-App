name: CI — Lint & Check

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: Frontend check
  lint:
    name:  Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name:  Install dependencies
        run: npm ci

      - name:  Check for build errors
        run: npx expo export --platform android --output-dir /tmp/expo-check || true

  # JOB 2: Backend check
  backend-check:
    name:  Check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name:  Install Django core packages
        run: |
          pip install \
            Django==6.0 \
            djangorestframework \
            django-environ

      - name:  Validate Django settings
        env:
          SECRET_KEY: "ci-test-secret-key-not-real"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost"
          OPENAI_API_KEY: "sk-test"
        run: |
          python - <<'PYEOF'
          import django
          import os
          from django.conf import settings

          settings.configure(
              SECRET_KEY='ci-test-secret-key-not-real',
              DEBUG=True,
              ALLOWED_HOSTS=['localhost'],
              INSTALLED_APPS=[
                  'django.contrib.admin',
                  'django.contrib.auth',
                  'django.contrib.contenttypes',
                  'django.contrib.sessions',
                  'django.contrib.messages',
                  'django.contrib.staticfiles',
                  'rest_framework',
              ],
              MIDDLEWARE=[
                  'django.middleware.security.SecurityMiddleware',
                  'django.contrib.sessions.middleware.SessionMiddleware',
                  'django.middleware.common.CommonMiddleware',
                  'django.middleware.csrf.CsrfViewMiddleware',
                  'django.contrib.auth.middleware.AuthenticationMiddleware',
                  'django.contrib.messages.middleware.MessageMiddleware',
                  'django.middleware.clickjacking.XFrameOptionsMiddleware',
              ],
              TEMPLATES=[{
                  'BACKEND': 'django.template.backends.django.DjangoTemplates',
                  'DIRS': [],
                  'APP_DIRS': True,
                  'OPTIONS': {
                      'context_processors': [
                          'django.template.context_processors.request',
                          'django.contrib.auth.context_processors.auth',
                          'django.contrib.messages.context_processors.messages',
                      ],
                  },
              }],
              DATABASES={
                  'default': {
                      'ENGINE': 'django.db.backends.sqlite3',
                      'NAME': ':memory:',
                  }
              },
          )

          django.setup()
          from django.core.management import call_command
          call_command('check')
          print(' Django core configuration is valid!')
          PYEOF