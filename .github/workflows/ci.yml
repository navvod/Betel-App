name: CI — Lint & Check

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Frontend check
  # ──────────────────────────────────────────────────────────
  lint:
    name: ✅ Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check for build errors
        run: npx expo export --platform android --output-dir /tmp/expo-check || true

  # ──────────────────────────────────────────────────────────
  # JOB 2: Backend check
  # Both requirements.txt and manage.py are in backend/backend/
  # ──────────────────────────────────────────────────────────
  backend-check:
    name: ✅ Check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔍 Check Django configuration
        env:
          SECRET_KEY: "ci-test-secret-key-not-real"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost"
          OPENAI_API_KEY: "sk-test"
        run: python manage.py check